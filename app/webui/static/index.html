<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AuraVox</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0b0a16">
  <meta name="application-name" content="AuraVox">
  <meta name="apple-mobile-web-app-title" content="AuraVox">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/static/icon.svg">

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="btn-home" type="button" data-i18n-aria="nav.gallery">
      <span class="brand-mark" aria-hidden="true">
        <img src="/static/icon.svg" width="32" height="32" alt="">
      </span>
      <span class="brand-text"><strong data-i18n="app.brand">AuraVox</strong><span data-i18n="brand.sub"></span></span>
    </button>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <div id="ollama-status" class="status"><span class="dot"></span><span class="status-text" data-i18n="status.connecting"></span></div>
    <button class="top-btn mic-btn" id="btn-mic" type="button" data-state="browser" aria-pressed="false">
      <span class="mic-icon" aria-hidden="true"></span><span class="mic-dot" aria-hidden="true"></span>
      <span class="top-label"></span>
    </button>
    <details class="menu profile-menu" id="profile-menu" hidden></details>
    <button class="top-btn" id="btn-lists" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3.5 6l1.2 1.2L7 4.8M3.5 12l1.2 1.2L7 10.8M3.5 18l1.2 1.2L7 16.8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="top-label" data-i18n="nav.lists"></span>
    </button>
    <button class="top-btn" id="btn-shared" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="top-label" data-i18n="nav.shared"></span>
    </button>
    <button class="top-btn" id="btn-console" type="button" title="Ctrl+`">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9l3 3-3 3M12 15h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="top-label" data-i18n="nav.console"></span>
    </button>
    <details class="menu top-more">
      <summary class="icon-btn" data-i18n-aria="nav.more"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></summary>
      <div class="menu-pop">
        <button class="menu-item" type="button" data-top="mic"><span data-i18n="nav.mic_menu"></span></button>
        <button class="menu-item" type="button" data-top="lists"><span data-i18n="nav.lists"></span></button>
        <button class="menu-item" type="button" data-top="shared"><span data-i18n="nav.shared"></span></button>
        <button class="menu-item" type="button" data-top="console"><span data-i18n="nav.console"></span></button>
        <div class="menu-item"><span data-i18n="nav.lang"></span>
          <span class="lang-switch"><button type="button" data-ui-lang="es">ES</button><button type="button" data-ui-lang="en">EN</button></span></div>
      </div>
    </details>
    <div class="lang-switch wide-only" role="group" id="ui-lang" data-i18n-aria="nav.lang">
      <button type="button" data-ui-lang="es" title="Español">ES</button>
      <button type="button" data-ui-lang="en" title="English">EN</button>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <div class="loading" data-i18n="loading"></div>
  </main>

  <section id="console" class="console" hidden aria-labelledby="console-title">
    <div class="console-resize" id="console-resize" aria-hidden="true"></div>
    <header class="console-head">
      <strong id="console-title" data-i18n="console.title"></strong>
      <span class="console-sub" data-i18n="console.sub"></span>
      <span class="spacer"></span>
      <input class="console-filter" id="console-filter" type="search" data-i18n-ph="console.filter">
      <select id="console-level" data-i18n-aria="console.level">
        <option value="all" data-i18n="console.all"></option>
        <option value="warn" data-i18n="console.warn"></option>
      </select>
      <label class="console-follow"><input type="checkbox" id="console-follow" checked> <span data-i18n="console.follow"></span></label>
      <button class="btn btn-sm" type="button" id="console-clear" data-i18n="console.clear"></button>
      <button class="icon-btn small" type="button" id="console-close" data-i18n-aria="console.close">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="console-body" id="console-body" role="log" aria-live="off"></div>
  </section>

  <dialog id="map-dialog" class="map-dialog" aria-labelledby="map-title">
    <header class="map-head">
      <div><h3 id="map-title" data-i18n="map.title"></h3><p data-i18n="map.sub"></p></div>
      <button class="icon-btn" type="button" data-map-act="cancel" data-i18n-aria="dialog.cancel">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </header>
    <form class="map-search" id="map-search">
      <input type="search" id="map-q" autocomplete="off" data-i18n-ph="map.search_ph">
      <button class="btn" type="submit" data-i18n="map.search"></button>
      <button class="btn" type="button" data-map-act="here" data-i18n="map.here"></button>
    </form>
    <div class="map-results" id="map-results" hidden></div>
    <div class="map-canvas" id="map-canvas"></div>
    <footer class="map-foot">
      <div class="map-selection">
        <strong id="map-place"></strong>
        <small id="map-coords"></small>
        <label class="map-fill"><input type="checkbox" id="map-fill"> <span data-i18n="map.fill"></span></label>
      </div>
      <div class="map-actions">
        <button class="btn" type="button" data-map-act="saved" id="map-saved-btn" data-i18n="map.saved"></button>
        <button class="btn" type="button" data-map-act="cancel" data-i18n="dialog.cancel"></button>
        <button class="btn btn-primary" type="button" data-map-act="use" id="map-use" data-i18n="map.use"></button>
      </div>
    </footer>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="dialog" class="dialog">
    <form method="dialog">
      <h3 id="dialog-title"></h3>
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel" type="submit" data-i18n="dialog.cancel"></button>
        <button class="btn btn-danger" value="ok" type="submit" id="dialog-ok"></button>
      </div>
    </form>
  </dialog>

  <script src="/static/i18n.js"></script>
  <script src="/static/orb.js"></script>
  <script src="/static/icons.js"></script>
  <script src="/static/features.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
